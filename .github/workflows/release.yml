name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure signing
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

  update-readme:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master

      - name: Update README version
        run: |
          sed -i "s/Latest release: \*\*v.*\*\*/Latest release: \*\*$GITHUB_REF_NAME\*\*/g" README.md

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update latest release to $GITHUB_REF_NAME [skip ci]" || echo "No changes to commit"
          git push origin master
